events {}
http {
    access_log off;
    # Signed S3 URLs must not enter logs, including upstream error messages.
    error_log /dev/null;
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_cache_path /var/cache/nginx/reports levels=1:2 keys_zone=reports:10m
                     max_size=1g inactive=24h use_temp_path=off;
    map $http_x_report_origin $report_origin {
        default "";
        ~^http://minio:9000/reports/v1/ $http_x_report_origin;
    }
    server {
        listen 8080;
        location = /health { return 200; }
        location /v1/ {
            # Only BFF can reach this private service. BFF authorizes every request first.
            if ($report_origin = "") { return 403; }
            limit_except GET { deny all; }
            proxy_pass $report_origin;
            proxy_pass_request_headers off;
            proxy_set_header Host minio:9000;
            proxy_cache reports;
            proxy_cache_key $uri;
            proxy_cache_valid 200 24h;
            proxy_cache_lock on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            add_header X-Report-Cache $upstream_cache_status always;
        }
        location / { return 404; }
    }
}
