# Merge after Task1, Task2 and Task3; paths are relative to Task1.
services:
  airflow-scheduler:
    volumes:
      - ../Task4/airflow:/opt/airflow/task4:ro

  airflow-webserver:
    volumes:
      - ../Task4/airflow:/opt/airflow/task4:ro

  source-db:
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=4, -c, max_wal_senders=4]
    environment:
      CDC_PASSWORD: ${CDC_PASSWORD:?Run Task4/setup.ps1}

  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: QmlvbmljUFJPU3ByaW50OQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1]
      interval: 10s
      timeout: 10s
      retries: 30

  kafka-connect:
    image: quay.io/debezium/connect:3.3.1.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bionicpro-connect
      CONFIG_STORAGE_TOPIC: bionicpro_connect_config
      OFFSET_STORAGE_TOPIC: bionicpro_connect_offsets
      STATUS_STORAGE_TOPIC: bionicpro_connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
    volumes:
      - ../Task4/.local:/run/cdc:ro
      - ../Task4/debezium:/config:ro
    healthcheck:
      test: [CMD-SHELL, curl -fsS http://localhost:8083/connectors >/dev/null]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      kafka:
        condition: service_healthy
      source-db:
        condition: service_healthy

volumes:
  kafka-data:
