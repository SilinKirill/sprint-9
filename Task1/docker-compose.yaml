name: sprint-9

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ../postgres-keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "keycloak_user", "-d", "keycloak_db"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  openldap:
    image: osixia/openldap:1.5.0
    hostname: openldap
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?Run docker compose -f compose.setup.yaml run --rm --build setup first}
      LDAP_TLS: "true"
      LDAP_TLS_ENFORCE: "true"
      LDAP_TLS_VERIFY_CLIENT: never
      LDAP_TLS_CRT_FILENAME: tls.crt
      LDAP_TLS_KEY_FILENAME: tls.key
      LDAP_TLS_CA_CRT_FILENAME: ca.crt
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-users.ldif:ro
      - ./.local/tls:/container/service/slapd/assets/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "LDAPTLS_CACERT=/container/service/slapd/assets/certs/ca.crt ldapsearch -x -H ldaps://openldap:636 -b '' -s base namingContexts >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  keycloak:
    build: ./keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_URL: https://localhost:8443
      KC_HOSTNAME_ADMIN_URL: https://localhost:8443
      KC_PROXY: edge
      KC_HEALTH_ENABLED: "true"
      BIONICPRO_CLIENT_SECRET: ${BIONICPRO_CLIENT_SECRET:?Run docker compose -f compose.setup.yaml run --rm --build setup first}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      YANDEX_ENABLED: ${YANDEX_ENABLED:-false}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak/keycloak-results-export.json:/opt/keycloak/data/import/reports-realm.json:ro
      - ./.local/tls/tls.crt:/certs/tls.crt:ro
    depends_on:
      keycloak_db:
        condition: service_healthy
      openldap:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  bionicpro-auth:
    build: ./bionicpro-auth
    environment:
      PUBLIC_ORIGIN: https://localhost:8443
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: https://localhost:8443/realms/reports-realm
      KEYCLOAK_REALM: reports-realm
      OIDC_CLIENT_ID: bionicpro-auth
      OIDC_CLIENT_SECRET: ${BIONICPRO_CLIENT_SECRET}
      TOKEN_KEY_FILE: /run/secrets/token-encryption.key
      PROFILE_DB: /data/profiles.db
      YANDEX_ENABLED: ${YANDEX_ENABLED:-false}
    volumes:
      - ./.local/token-encryption.key:/run/secrets/token-encryption.key:ro
      - auth-data:/data
    depends_on:
      keycloak-setup:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./.local/tls:/etc/nginx/tls:ro
    depends_on:
      - bionicpro-auth

  keycloak-setup:
    image: python:3.12-slim
    command: ["python", "/setup/provision.py"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      BIONICPRO_CLIENT_SECRET: ${BIONICPRO_CLIENT_SECRET}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      YANDEX_ENABLED: ${YANDEX_ENABLED:-false}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
    volumes:
      - ./keycloak:/setup:ro
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  ldap-data:
  ldap-config:
  auth-data:
